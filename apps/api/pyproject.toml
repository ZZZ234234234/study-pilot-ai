[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "studypilot-api"
version = "0.1.0"
description = "Source-grounded learning with PDF, pgvector, and portable AI providers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
  "alembic>=1.14,<2", "pypdf>=6,<7", "python-multipart>=0.0.22,<1",
  "httpx>=0.28,<1", "itsdangerous>=2.2,<3", "numpy>=2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "reportlab>=4.4,<5"]

[tool.setuptools.packages.find]
include = ["studypilot*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
