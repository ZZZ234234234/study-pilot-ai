<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">StudyPilot AI — Less collecting. More connecting.</title>
  <desc id="desc">An original editorial-style project banner showing a document connected to knowledge, review, and source-grounded questions. This is a diagram, not an application screenshot.</desc>
  <rect width="1600" height="640" fill="#f4f5ef"/>
  <path d="M72 68h1456M72 566h1456" stroke="#d8dbcf"/>
  <rect x="76" y="104" width="56" height="56" rx="13" fill="#273d30"/>
  <path d="M115 117H96l-9 10 22 13-9 9H85" stroke="#d4e8aa" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#24352b">
    <text x="151" y="140" font-size="28" font-weight="700">StudyPilot AI</text>
    <text x="76" y="260" font-size="64" letter-spacing="-2" font-weight="700">Less collecting.</text>
    <text x="76" y="337" font-size="64" letter-spacing="-2" font-weight="700">More connecting.</text>
    <text x="80" y="400" font-size="21" fill="#697364">Turn PDFs into structured knowledge.</text>
    <text x="80" y="435" font-size="21" fill="#697364">Understand. Review. Ask. Follow the source.</text>
    <text x="80" y="529" font-size="14" letter-spacing="3">OPEN SOURCE / SELF-HOSTABLE / MIT</text>
    <text x="1520" y="608" font-size="13" text-anchor="end" fill="#697364">NEXT.JS + FASTAPI + PGVECTOR</text>
  </g>
  <g transform="translate(905 108)">
